services:
  mysql:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    image: uuid-benchmark-mysql:8
    container_name: uuid-bench-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-uuid_benchmark}
      MYSQL_USER: ${MYSQL_USER:-benchmark}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-benchmark123}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb_buffer_pool_size=4G
      --innodb_log_file_size=1G
      --innodb_flush_log_at_trx_commit=1
      --innodb_flush_method=O_DIRECT
      --performance_schema=ON
      --innodb_monitor_enable=index_page_splits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '4'
          memory: 8G
    networks:
      - benchmark_network

networks:
  benchmark_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
